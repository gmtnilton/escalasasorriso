name: Android Build

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run financial logic tests (:core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meus-jogos-arbitragem-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Publish APK to a stable Release (always up to date)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: "Meus Jogos de Arbitragem — build de debug"
          body: |
            APK de debug gerado automaticamente pelo CI a partir do commit
            ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Baixe o `.apk` abaixo e instale direto no celular (Android 8.0+).
            Este release é atualizado a cada novo push que compila com sucesso.
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
